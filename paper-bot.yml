name: paper-bot
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: paper-bot
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python solana_paper_bot.py --once
      - name: Save state
        run: |
          git config user.name "paper-bot"
          git config user.email "bot@users.noreply.github.com"
          git add paper_state.json
          git commit -m "update state" || echo "no changes"
          git push
